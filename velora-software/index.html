<!doctype html>
<html lang="en-KE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Velora · Bookings &amp; appointments</title>
    <meta name="description" content="Velora helps salons, barbershops, spas and beauty professionals in Kenya take bookings online, send reminders and run their day from one calm dashboard." />
    <meta name="application-name" content="Velora" />
    <meta name="apple-mobile-web-app-title" content="Velora" />
    <meta name="theme-color" content="#f8f7f2" />
    <meta name="color-scheme" content="light" />
    <link rel="canonical" href="__SITE_URL__/" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link previews (WhatsApp, Facebook, X, LinkedIn, Slack). The site URL comes from VITE_SITE_URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Velora" />
    <meta property="og:locale" content="en_KE" />
    <meta property="og:title" content="Velora · Bookings &amp; appointments" />
    <meta property="og:description" content="Online booking, reminders and a calm dashboard for salons, barbershops, spas and beauty professionals." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Velora: beautifully managed bookings for salons, spas and barbershops" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Velora · Bookings &amp; appointments" />
    <meta name="twitter:description" content="Online booking, reminders and a calm dashboard for salons, barbershops, spas and beauty professionals." />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Same font requests the pages used to make from their CSS, in the same order, so text renders identically. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" />

    <!-- Shown for the split second before the app starts, so the first paint is on-brand, not blank. -->
    <style>
      html, body { margin: 0; background: #f8f7f2; }
      .boot { min-height: 100vh; display: grid; place-items: center; }
      .boot svg { width: 44px; height: 44px; animation: boot 1.8s ease-in-out infinite; }
      @keyframes boot { 50% { transform: scale(.92); opacity: .8; } }
      @media (prefers-reduced-motion: reduce) { .boot svg { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-hidden="true">
        <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#3e5948"/><path d="M32 50C21 45 14.5 34 16 15.5 25.5 21 31 32 32 50Z" fill="#f8f7f2"/><path d="M32 50C43 45 49.5 34 48 15.5 38.5 21 33 32 32 50Z" fill="#a8bea9"/><circle cx="32" cy="16" r="4" fill="#f8f7f2"/></svg>
      </div>
    </div>
    <noscript>
      <p style="font-family: sans-serif; text-align: center; padding: 40px 20px; color: #26332c">
        Velora needs JavaScript to run. Please turn it on in your browser settings and reload the page.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
